# Queries with arguments, aliases and variables.
query GetUser($id: ID!) {
  user(id: $id) {
    id
    name
    email
    posts {
      title
    }
  }
}

query ListUsers($first: Int!, $after: String) {
  users(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query Search($term: String!) {
  search(term: $term) {
    __typename
    ... on User { id name }
    ... on Post { id title }
  }
}
