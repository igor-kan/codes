<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embedded Content</title>
</head>
<body>
  <iframe src="https://example.com/widget" title="Example widget"
          width="400" height="300" loading="lazy"
          sandbox="allow-scripts allow-same-origin"></iframe>

  <object data="report.pdf" type="application/pdf" width="600" height="400">
    <p>Unable to display PDF. <a href="report.pdf">Download it</a>.</p>
  </object>
</body>
</html>
