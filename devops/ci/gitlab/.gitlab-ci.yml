stages: [build, test, deploy]

variables:
  DOCKER_DRIVER: overlay2

default:
  image: node:22
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths: [node_modules/]

build:
  stage: build
  script:
    - npm ci
    - npm run build --if-present
  artifacts:
    paths: [dist/]
    expire_in: 1 week

test:
  stage: test
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
