receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: { timeout: 5s }
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75

exporters:
  otlphttp:
    endpoint: https://otlp.example.com
  logging: { verbosity: basic }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
