<form class="mx-auto max-w-md space-y-4 rounded-xl bg-white p-6 shadow">
  <div>
    <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
    <input id="email" type="email" required
           class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm">
  </div>
  <div>
    <label for="message" class="block text-sm font-medium text-slate-700">Message</label>
    <textarea id="message" rows="3"
              class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm"></textarea>
  </div>
  <button type="submit" class="btn-primary w-full justify-center">Send</button>
</form>
