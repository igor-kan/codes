<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form Validation</title>
</head>
<body>
  <form action="/subscribe" method="post" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required
           autocomplete="email" aria-describedby="email-help">
    <small id="email-help">We never share your address.</small>

    <label for="age">Age</label>
    <input id="age" name="age" type="number" min="13" max="120" required>

    <label for="plan">Plan</label>
    <select id="plan" name="plan">
      <option value="free">Free</option>
      <option value="pro">Pro</option>
    </select>

    <button type="submit">Subscribe</button>
  </form>
</body>
</html>
