<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessible Table</title>
</head>
<body>
  <table>
    <caption>Quarterly revenue (USD millions)</caption>
    <thead>
      <tr>
        <th scope="col">Quarter</th>
        <th scope="col">Revenue</th>
      </tr>
    </thead>
    <tbody>
      <tr><th scope="row">Q1</th><td>12.4</td></tr>
      <tr><th scope="row">Q2</th><td>15.1</td></tr>
    </tbody>
    <tfoot>
      <tr><th scope="row">Total</th><td>27.5</td></tr>
    </tfoot>
  </table>
</body>
</html>
