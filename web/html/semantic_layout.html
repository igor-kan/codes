<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Layout</title>
</head>
<body>
  <header>
    <h1>Site Title</h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#docs">Docs</a></li>
      </ul>
    </nav>
  </header>
  <main id="home">
    <article>
      <h2>Article heading</h2>
      <section>
        <h3>Section</h3>
        <p>Semantic elements describe document structure.</p>
      </section>
    </article>
    <aside aria-label="Related links">
      <p>Related content.</p>
    </aside>
  </main>
  <footer>
    <p>&copy; 2026</p>
  </footer>
</body>
</html>
