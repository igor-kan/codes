- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.package:
    name: [curl, git, ufw, fail2ban]
    state: present

- name: Enable firewall
  ansible.builtin.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  ansible.builtin.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
