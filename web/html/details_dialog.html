<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Details and Dialog</title>
</head>
<body>
  <details>
    <summary>What is HTML?</summary>
    <p>A markup language for structuring web content.</p>
  </details>

  <button id="open">Open dialog</button>
  <dialog id="dlg">
    <form method="dialog">
      <p>Confirm action?</p>
      <button value="cancel">Cancel</button>
      <button value="ok">OK</button>
    </form>
  </dialog>
  <script>
    const dlg = document.getElementById("dlg");
    document.getElementById("open").addEventListener("click", () => dlg.showModal());
  </script>
</body>
</html>
